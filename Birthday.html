<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Party</title>
  <link rel="stylesheet" href="birthday.css">
</head>
<body>

  <!-- Images Section -->
  <section class="images-section">
    <h1>Birthday Party</h1>
    <div class="image-container">
      <img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=1000&q=80" alt="Birthday Hall Image">
    </div>
  </section>

  <!-- Birthday Party Halls Dropdown & Booking Section -->
  <section class="booking-section">
    <form action="#" method="POST">
      <label for="birthday-halls">Birthday party halls:</label>
      <select id="birthday-halls" name="birthday_hall" required>
        <option value="" disabled selected>Select Hall</option>
        <option value="1">1. Grand Velvet Ballroom</option>
        <option value="2">2. Starlight Party Arena</option>
        <option value="3">3. Gardenia Open-Air Lawn</option>
      </select>

      <button type="submit" class="book-btn">Book Now</button>
    </form>
  </section>

</body>
</html>
