<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amore Events - Wedding Party</title>
  <link rel="stylesheet" href="wedding.css">
</head>
<body>

  <!-- Banner Section -->
  <header class="banner-section">
    <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1200&q=80" alt="Wedding Banner" class="banner-img">
    <div class="banner-text">
      <h1>Wedding Party Halls</h1>
    </div>
  </header>

  <!-- Booking Section -->
  <main class="booking-container">
    <form class="booking-form">
      <label for="wedding-halls" class="form-label">Select Wedding Party Hall:</label>
      
      <select id="wedding-halls" name="wedding-halls" class="dropdown-select" required>
        <option value="" disabled selected>Choose a Hall</option>
        <option value="hall1">1. Grand Royal Ballroom</option>
        <option value="hall2">2. Sunset Beach Garden</option>
        <option value="hall3">3. Imperial Banquet Hall</option>
      </select>

      <button type="submit" class="book-now-btn">Book Now</button>
    </form>
  </main>

</body>
</html>
