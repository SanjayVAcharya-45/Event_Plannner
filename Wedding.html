<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Party</title>
  <link rel="stylesheet" href="wedding.css">
</head>
<body>

  <!-- Images Section -->
  <section class="images-section">
    <h1>Wedding Party</h1>
    <div class="image-container">
      <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1000&q=80" alt="Wedding Hall Image">
    </div>
  </section>

  <!-- Wedding Party Halls Dropdown & Booking Section -->
  <section class="booking-section">
    <form action="#" method="POST">
      <label for="wedding-halls">Wedding party halls:</label>
      <select id="wedding-halls" name="wedding_hall" required>
        <option value="" disabled selected>Select Hall</option>
        <option value="1">1. Royal Imperial Palace</option>
        <option value="2">2. Sunset Beach Resort</option>
        <option value="3">3. Crystal Glass Pavilion</option>
      </select>

      <button type="submit" class="book-btn">Book Now</button>
    </form>
  </section>

</body>
</html>
